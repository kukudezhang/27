<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字跑马灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --accent: #ff3c00;
    --accent2: #00e5ff;
    --accent3: #c8ff00;
    --text: #f0ece4;
    --glow: rgba(255, 60, 0, 0.6);
    --glow2: rgba(0, 229, 255, 0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Noto Serif SC', serif;
    position: relative;
  }

  /* 背景噪点 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
  }

  /* 背景渐变光晕 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 40%, rgba(255, 60, 0, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 60%, rgba(0, 229, 255, 0.06) 0%, transparent 50%);
    pointer-events: none;
  }

  .marquee-container {
    width: 100%;
    overflow: hidden;
    position: relative;
    padding: 18px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }

  .marquee-track {
    display: flex;
    width: max-content;
    will-change: transform;
  }

  .marquee-content {
    display: flex;
    align-items: center;
    gap: 60px;
    padding: 0 30px;
    flex-shrink: 0;
  }

  .marquee-content span {
    white-space: nowrap;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .marquee-content .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* --- 第1行：从右往左，主色调 --- */
  .row-1 .marquee-track {
    animation: scroll-left 22s linear infinite;
  }
  .row-1 .marquee-content span {
    font-size: clamp(28px, 5vw, 56px);
    color: var(--accent);
    text-shadow: 0 0 30px var(--glow), 0 0 60px rgba(255, 60, 0, 0.25);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
  }
  .row-1 .dot { background: var(--accent); box-shadow: 0 0 12px var(--glow); }

  /* --- 第2行：从左往右，青色 --- */
  .row-2 .marquee-track {
    animation: scroll-right 18s linear infinite;
  }
  .row-2 .marquee-content span {
    font-size: clamp(16px, 2.5vw, 28px);
    color: var(--accent2);
    text-shadow: 0 0 25px var(--glow2);
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .row-2 .dot { background: var(--accent2); box-shadow: 0 0 12px var(--glow2); }

  /* --- 第3行：从右往左，黄绿色 --- */
  .row-3 .marquee-track {
    animation: scroll-left 26s linear infinite;
  }
  .row-3 .marquee-content span {
    font-size: clamp(36px, 6vw, 72px);
    color: transparent;
    -webkit-text-stroke: 1.5px var(--accent3);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
  }
  .row-3 .dot { background: var(--accent3); box-shadow: 0 0 12px rgba(200, 255, 0, 0.5); }

  /* --- 第4行：从左往右，白色副文字 --- */
  .row-4 .marquee-track {
    animation: scroll-right 30s linear infinite;
  }
  .row-4 .marquee-content span {
    font-size: clamp(14px, 2vw, 22px);
    color: rgba(240, 236, 228, 0.35);
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .row-4 .dot { background: rgba(240, 236, 228, 0.25); }

  /* --- 第5行：从右往左，主色调大字 --- */
  .row-5 .marquee-track {
    animation: scroll-left 20s linear infinite;
  }
  .row-5 .marquee-content span {
    font-size: clamp(40px, 7vw, 88px);
    color: var(--text);
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
  }
  .row-5 .dot { background: var(--text); box-shadow: 0 0 10px rgba(255,255,255,0.2); }

  /* --- 第6行：从左往右，下划线装饰 --- */
  .row-6 .marquee-track {
    animation: scroll-right 24s linear infinite;
  }
  .row-6 .marquee-content span {
    font-size: clamp(18px, 3vw, 36px);
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
    font-family: 'Noto Serif SC', serif;
    font-weight: 700;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 8px;
  }
  .row-6 .dot { background: var(--accent); box-shadow: 0 0 8px var(--glow); }

  /* 动画定义 */
  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  @keyframes scroll-right {
    0%   { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  /* 悬浮暂停 */
  .marquee-container:hover .marquee-track {
    animation-play-state: paused;
  }

  /* 中间标题 */
  .center-title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
  }
  .center-title h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(42px, 8vw, 100px);
    font-weight: 900;
    color: var(--bg);
    -webkit-text-stroke: 2px var(--text);
    letter-spacing: 0.08em;
    animation: breathe 4s ease-in-out infinite;
  }
  .center-title p {
    font-family: 'Space Mono', monospace;
    font-size: clamp(10px, 1.4vw, 16px);
    color: rgba(240, 236, 228, 0.4);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 12px;
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.6; }
  }

  /* 入场动画 */
  .marquee-container {
    opacity: 0;
    animation: fade-in 0.8s ease forwards;
  }
  .marquee-container:nth-child(1)  { animation-delay: 0.0s; }
  .marquee-container:nth-child(2)  { animation-delay: 0.1s; }
  .marquee-container:nth-child(3)  { animation-delay: 0.2s; }
  .marquee-container:nth-child(4)  { animation-delay: 0.3s; }
  .marquee-container:nth-child(5)  { animation-delay: 0.4s; }
  .marquee-container:nth-child(6)  { animation-delay: 0.5s; }
  .marquee-container:nth-child(7)  { animation-delay: 0.6s; }
  .marquee-container:nth-child(8)  { animation-delay: 0.7s; }
  .marquee-container:nth-child(9)  { animation-delay: 0.8s; }
  .marquee-container:nth-child(10) { animation-delay: 0.9s; }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- 居中主标题 -->
<div class="center-title">
  <h1>跑马灯</h1>
  <p>Hover to pause &middot; 悬浮暂停</p>
</div>

<script>
  // 配置每一行的内容、方向、CSS类
  const rows = [
    {
      cls: 'row-1',
      texts: ['熊俊还钱', 'ix', '骆驼祥子', 'ltxz', '熊俊还钱', '骆驼祥子还钱', 'wsix']
    },
    {
      cls: 'row-2',
      texts: ['ix', 'ltxz', 'fwxz', 'sbix', 'wsix', 'ixhq']
    },
    {
      cls: 'row-3',
      texts: ['熊俊还钱', 'ix', '骆驼祥子', 'ltxz', '熊俊还钱', '骆驼祥子还钱', 'wsix']
    },
    {
      cls: 'row-4',
      texts: ['ix', 'ltxz', 'fwxz', 'sbix', 'wsix', 'ixhq']
    },
    {
      cls: 'row-5',
      texts: ['熊俊还钱', 'ix', '骆驼祥子', 'ltxz', '熊俊还钱', '骆驼祥子还钱', 'wsix']
    },
    {
      cls: 'row-6',
      texts: ['ix', 'ltxz', 'fwxz', 'sbix', 'wsix', 'ixhq']
    }
  ];

  const container = document.body;

  rows.forEach(row => {
    // 创建容器
    const wrapper = document.createElement('div');
    wrapper.className = `marquee-container ${row.cls}`;

    const track = document.createElement('div');
    track.className = 'marquee-track';

    // 生成内容函数
    function buildContent() {
      const content = document.createElement('div');
      content.className = 'marquee-content';
      row.texts.forEach((txt, i) => {
        const span = document.createElement('span');
        span.textContent = txt;
        content.appendChild(span);
        // 每个文字后面加一个圆点（除了最后一个）
        if (i < row.texts.length - 1) {
          const dot = document.createElement('div');
          dot.className = 'dot';
          content.appendChild(dot);
        }
      });
      return content;
    }

    // 复制两份以实现无缝滚动
    track.appendChild(buildContent());
    track.appendChild(buildContent());

    wrapper.appendChild(track);
    container.appendChild(wrapper);
  });
</script>

</body>
</html>
